# Input topics handled/muxed.
# For each topic:
# - name    : name identifier to select the topic (*sub-namespace, see below)
# - topic   : input topic of geometry_msgs::Twist type
# - timeout : timeout in seconds to start discarding old messages, and use 0.0 speed instead
# - priority: priority in the range [0, 255]; the higher the more priority over other topics

twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel_smoothed # cmd_vel_nav # Smoothed is from Nav2 Velocity smoother. See navigation_launch.py for remappings
        timeout : 0.5
        priority: 10
      joystick:
        topic   : cmd_vel_base
        timeout : 0.5
        priority: 100
      # keyboard:
      #   topic   : key_vel
      #   timeout : 0.5
      #   priority: 90
      # tablet:
      #   topic   : tab_vel
      #   timeout : 0.5
      #   priority: 100
